; evo2026 renderer settings for 4x4 Evo 2 (read at game start).
; The game itself rewrites render.ini on exit, so these live in their own file.
[evo2026]
; Output size, 0 = your monitor's native resolution
Width=0
Height=0
; 0 = exclusive fullscreen, 1 = window, 2 = borderless fullscreen window
Window=2
; Only used when Widescreen=0: 1 = keep 4:3 with side bars, 0 = stretch
Aspect=1
VSync=1
; Texture anisotropic filtering, 0/1 = off, up to 16
Anisotropy=16
; 1 = smooth scaling of 2D art (menus, loading screens), 0 = sharp pixels
Filter2D=1
; 1 = true widescreen: wider view at the sides, nothing stretched. 0 = classic 4:3
Widescreen=1
; 1 = in widescreen, move the race HUD (times, map, gauges) to the screen edges
HudToEdges=1
; 1 = load HD replacement textures from .\textures
ReplaceTextures=1
; 1 = save every texture the game loads to .\textures_dump (for making texture packs)
DumpTextures=0
; 1 = write .\system\evo2026.log (for troubleshooting)
Trace=0
